<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Story — MyBlog Editorial</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="https://res.cloudinary.com/djxr1flup/image/upload/v1770139106/IdealBliss_nwjfnf.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          darkMode: 'class',
        }
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        #post-title, #post-content { 
            font-family: 'Noto Sans Sinhala', 'Inter', sans-serif; 
            line-height: 1.6;
        }

        * {
            transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), 
                        border-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), 
                        color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #theme-indicator {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Writing Area Highlights & Dynamic Borders */
        #post-title, #post-content {
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #374151; /* Dark border for Light Mode */
            background-color: transparent;
            color: #000000; /* Black text for Light Mode */
        }

        .dark #post-title, .dark #post-content {
            border-color: #d1d5db; /* Light border for Dark Mode */
            color: #f3f4f6; /* Off-white text for Dark Mode */
        }

        /* Placeholder (Ghost Words) High Contrast Logic */
        #post-title::placeholder, #post-content::placeholder {
            color: #000000;
            opacity: 1;
        }

        .dark #post-title::placeholder, .dark #post-content::placeholder {
            color: #9ca3af;
            opacity: 1;
        }

        #post-title:focus, #post-content:focus {
            background-color: rgba(243, 244, 246, 0.5);
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            outline: none;
        }

        .dark #post-title:focus, .dark #post-content:focus {
            background-color: rgba(255, 255, 255, 0.03);
            border-color: #60a5fa;
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.1);
        }

        textarea::-webkit-scrollbar { width: 0px; }
        .animate-pulse-soft { animation: pulse-opacity 2s infinite ease-in-out; }
        @keyframes pulse-opacity { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }


        #word-counter {
    opacity: 0.6;
}

#word-counter:hover {
    opacity: 1;
    background-color: rgba(59, 130, 246, 0.1);
    border-color: rgba(59, 130, 246, 0.3);
}
/* Author Name Specific Styles */
#author-name {
    background-color: transparent !important;
}

#author-name::placeholder {
    color: #d1d5db; /* Light gray for light mode */
    transition: color 0.5s ease;
}

.dark #author-name::placeholder {
    color: #4b5563; /* Darker gray for dark mode */
}

/* Ensure focus doesn't create a weird box since this is an underline style */
#author-name:focus {
    outline: none;
}
    </style>
</head>

<body class="bg-white dark:bg-[#0f0f0f] text-gray-900 dark:text-gray-100 min-h-screen opacity-0 transition-opacity duration-500">

    <nav class="flex justify-between items-center px-8 py-4 sticky top-0 bg-white/80 dark:bg-[#0f0f0f]/80 z-50 border-b dark:border-gray-800 backdrop-blur-md">
        <div class="flex items-center gap-6">
            <div class="relative bg-gray-100 dark:bg-gray-800 p-1 rounded-full flex items-center w-24 h-10 cursor-pointer" id="theme-toggle-container">
                <div id="theme-indicator" class="absolute w-10 h-8 bg-blue-600 rounded-full shadow-lg shadow-blue-500/30"></div>
                <div class="relative z-10 flex justify-around w-full items-center">
                    <span class="text-lg select-none">☀️</span>
                    <span class="text-lg select-none">🌙</span>
                </div>
            </div>
            <a href="index.html" class="flex items-center gap-2 text-sm font-medium text-gray-400 hover:text-red-500 transition">
                <span class="w-2 h-2 rounded-full bg-gray-300 dark:bg-gray-700"></span>
                Discard Draft
            </a>
        </div>
        <button id="publish-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-2 rounded-lg font-bold transition-all transform active:scale-95 shadow-lg shadow-blue-500/20">
            Publish
        </button>
    </nav>

    <main class="max-w-4xl mx-auto mt-20 px-6 pb-32">
    <input type="text" id="post-title" placeholder="Enter post title..." 
       class="w-full text-4xl font-bold border-none outline-none mb-2 bg-transparent" 
       autofocus>

    <div class="flex items-center gap-2 mb-6 border-b border-gray-100 dark:border-gray-800 pb-2 transition-colors duration-500">
        <span class="text-gray-400 text-sm italic">By:</span>
        <input type="text" id="author-name" placeholder="Your name..." 
               class="text-lg bg-transparent text-gray-700 dark:text-gray-200 outline-none w-full placeholder-gray-300 dark:placeholder-gray-600">
    </div>

    <textarea id="post-content" placeholder="Tell your story..." 
              class="w-full text-xl leading-relaxed bg-transparent min-h-[300px] resize-none mb-10 focus:outline-none"></textarea>

    <div id="image-section" class="border-t dark:border-gray-800 pt-8 mt-10">
        <div class="flex items-center gap-4 text-sm text-gray-500 mb-6">
            <div id="save-status" class="flex items-center gap-2 min-w-[120px]">
                <svg class="h-3 w-3 text-green-500" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                </svg>
                <span class="text-[10px] uppercase tracking-widest font-black">Draft Saved</span>
            </div>
            <span class="text-gray-300 dark:text-gray-700">|</span>
            <span id="word-count-display" class="text-[10px] uppercase tracking-widest font-black">0 words</span>
            <span class="text-gray-300 dark:text-gray-700">|</span>
            <span id="reading-time-display" class="text-[10px] uppercase tracking-widest font-black">1 min read</span>
        </div>

        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-4">
                <button id="upload-trigger" class="flex items-center gap-2 px-4 py-2 bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-blue-600 hover:text-white rounded-lg text-xs font-bold uppercase tracking-wider transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    <span>Add Cover Photo</span>
                </button>
                <input type="file" id="file-input" accept="image/*" class="hidden">
                <span id="upload-status" class="text-xs text-blue-500 animate-pulse hidden">Uploading...</span>
            </div>
        </div>

        <div id="preview-container" class="hidden relative group max-w-full overflow-hidden rounded-2xl">
            <div id="image-gallery" class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6"></div>
            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                 <button id="remove-image" class="bg-red-600 text-white px-4 py-2 rounded-lg font-bold text-sm transform hover:scale-105 transition">Remove Photo</button>
            </div>
            <img id="image-preview" src="" class="w-full h-64 object-cover border dark:border-gray-800">
        </div>
    </div>
</main> 

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="editor.js"></script>
</body> 
</html>
