<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ideal Bliss</title>
    <meta name="description" content="A professional space to write and read insightful stories.">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://your-site-url.com/">
    <meta property="og:title" content="Ideal Bliss – Share Your Story">
    <meta property="og:description" content="A professional space to write and read insightful stories.">
    <meta property="og:image" content="https://res.cloudinary.com/djxr1flup/image/upload/v1770139106/IdealBliss_nwjfnf.png">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Ideal Bliss – Share Your Story">
    <meta property="twitter:description" content="Write and discover amazing stories.">
    <meta property="twitter:image" content="https://res.cloudinary.com/djxr1flup/image/upload/v1770139106/IdealBliss_nwjfnf.png">
    <link rel="icon" type="image/x-icon" href="https://res.cloudinary.com/djxr1flup/image/upload/v1770139106/IdealBliss_nwjfnf.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Dark Mode Skeleton Shimmer */
        @keyframes shimmer {
            0% { background-position: -468px 0; }
            100% { background-position: 468px 0; }
        }

        .skeleton-box {
            width: 100%;
            height: 300px;
            background: #1a1a1a;
            background-image: linear-gradient(to right, #1a1a1a 0%, #262626 20%, #1a1a1a 40%, #1a1a1a 100%);
            background-repeat: no-repeat;
            background-size: 800px 104px;
            display: inline-block;
            position: relative;
            animation: shimmer 1.5s linear infinite forwards;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
        }

        .loaded .skeleton-box { display: none; }

        /* Modal Image Styling */
        #modal-gallery img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* Professional Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #0f0f0f; }
        ::-webkit-scrollbar-thumb { 
            background: #262626; 
            border-radius: 10px; 
            border: 2px solid #0f0f0f; 
        }
        ::-webkit-scrollbar-thumb:hover { background: #333333; }

        .glass {
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        html { scrollbar-gutter: stable; }
    </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body class="bg-[#0f0f0f] text-gray-200 font-sans leading-normal tracking-normal">

<nav class="glass p-4 sticky top-0 z-50">
    <div class="container mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-bold text-indigo-500 tracking-tighter">Ideal.Bliss</h1>
        <div class="flex items-center space-x-6">
            <button id="smart-post-btn" class="flex items-center gap-2 text-gray-400 hover:text-indigo-400 font-medium transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Post
            </button>
            <div id="logged-out-ui" class="flex items-center space-x-4">
                <button onclick="openAuthModal(false)" class="text-gray-400 hover:text-white">Log In</button>
                <button onclick="openAuthModal(true)" class="bg-indigo-600 text-white px-5 py-2 rounded-xl hover:bg-indigo-500 transition shadow-lg shadow-indigo-500/20">Sign Up</button>
            </div>
            <div id="logged-in-ui" class="hidden">
                <button id="logout-btn" class="text-red-400 hover:text-red-300 text-sm font-medium">Logout</button>
            </div>
        </div>
    </div>
</nav>

<main class="container mx-auto mt-10 px-4 max-w-4xl">
    <div class="mb-8">
        <input type="text" id="search-bar" placeholder="Search stories..." 
               class="w-full p-4 rounded-2xl bg-[#1a1a1a] border border-gray-800 text-white focus:ring-2 focus:ring-indigo-500 outline-none transition shadow-2xl">
    </div>

    <div class="flex items-center space-x-8 border-b border-gray-800 mb-8">
        <button id="tab-all" onclick="switchTab('all')" 
                class="pb-3 text-sm font-bold border-b-2 border-indigo-500 text-indigo-500 transition-all">
            All Stories
        </button>
        <button id="tab-saved" onclick="switchTab('saved')" 
                class="pb-3 text-sm font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-300 transition-all flex items-center gap-2">
            Reading List
            <span id="saved-count" class="bg-gray-800 text-gray-400 text-[10px] px-2 py-0.5 rounded-full border border-gray-700 transition-all duration-300">0</span>
        </button>
    </div>

    <h2 id="feed-title" class="text-3xl font-extrabold text-white mb-8 tracking-tight">Latest Stories</h2>

    <section id="posts-feed" class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div id="feed-loader" class="col-span-full text-center py-20 text-gray-600 animate-pulse">
            Fetching stories from the void...
        </div>
    </section>
    <!-- Pagination Container -->
    <div id="pagination-container"></div>
</main>

<div id="reader-modal" class="hidden fixed inset-0 bg-[#0f0f0f] z-[100] overflow-hidden">
    <div class="fixed top-0 left-0 w-full h-1.5 bg-gray-900 z-[130]">
        <div id="read-progress-bar" class="h-full bg-indigo-500 transition-all duration-150" style="width: 0%"></div>
    </div>

    <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center bg-[#0f0f0f]/90 backdrop-blur-md sticky top-0 z-[120] border-b border-gray-800">
        <button onclick="closeReader()" class="flex items-center gap-2 text-gray-400 hover:text-white transition group">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            <span class="text-sm font-bold uppercase tracking-widest">Back to Stories</span>
        </button>
        <span id="modal-author-info" class="text-xs font-bold text-gray-500 uppercase tracking-widest"></span>
    </div>

    <div id="modal-scroll-container" class="h-full overflow-y-auto pb-32 pt-10 bg-[#0f0f0f]">
        <div class="max-w-2xl mx-auto px-6">
            <h1 id="modal-title" class="text-4xl md:text-6xl font-black text-white mb-8 leading-tight"></h1>
            <div id="modal-gallery" class="mb-8 flex flex-col gap-6"></div>
            <div id="modal-body" class="text-lg md:text-xl text-gray-300 leading-relaxed whitespace-pre-wrap font-serif"></div>
            <div class="mt-20 pt-8 border-t border-gray-800 text-center">
                <p class="text-gray-600 italic text-sm mb-6">You've reached the end of this story.</p>
                <button onclick="closeReader()" class="inline-flex items-center gap-2 px-6 py-3 bg-[#1a1a1a] border border-gray-700 rounded-full text-gray-300 hover:text-white hover:border-indigo-500 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Back to Feed
                </button>
            </div>
        </div>
    </div>
</div>

<div id="auth-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[110] p-4">
    <div class="bg-[#1a1a1a] p-8 rounded-3xl border border-gray-800 shadow-2xl max-w-md w-full">
        <h2 id="modal-title" class="text-2xl font-bold mb-6 text-white">Login</h2>
        <input type="email" id="email" placeholder="Email" class="w-full p-3 mb-4 rounded-xl bg-[#0f0f0f] border border-gray-800 text-white focus:ring-2 focus:ring-indigo-500 outline-none">
        <div class="relative mb-6">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 rounded-xl bg-[#0f0f0f] border border-gray-800 text-white focus:ring-2 focus:ring-indigo-500 outline-none pr-12">
            <button id="toggle-password" class="absolute right-3 top-3 text-gray-500 hover:text-indigo-400">
                <svg id="eye-icon" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
            </button>
            <div class="mt-4">
                <div class="w-full bg-gray-800 rounded-full h-1.5">
                    <div id="strength-bar" class="bg-red-500 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>
        <div class="flex flex-col gap-3">
            <button id="auth-action-btn" class="bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-500 transition">Sign In</button>
            
            <!-- Divider -->
            <div class="relative my-2">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-700"></div>
                </div>
                <div class="relative flex justify-center text-xs uppercase">
                    <span class="bg-[#1a1a1a] px-2 text-gray-500">Or continue with</span>
                </div>
            </div>
            
            <!-- Google Sign-In Button -->
            <button onclick="handleGoogleSignIn()" class="w-full flex items-center justify-center gap-3 bg-white text-gray-700 py-3 rounded-xl font-semibold hover:bg-gray-50 transition border-2 border-gray-200">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>
            
            <button id="toggle-auth" class="text-indigo-400 text-sm hover:text-indigo-300 mt-2">Need an account? Sign Up</button>
            <button id="close-modal" class="text-gray-500 text-sm">Cancel</button>
        </div>
    </div>
</div>

<footer class="mt-20 py-12 border-t border-gray-900 text-center text-gray-600 text-sm">
    © 2026 Ideal Bliss. All rights reserved.
</footer>


<script src="index.js"></script>
</body>
</html>
