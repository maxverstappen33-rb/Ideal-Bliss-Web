<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password | MyBlog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/x-icon" href="https://res.cloudinary.com/djxr1flup/image/upload/v1770139106/IdealBliss_nwjfnf.png">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full">
        <h2 class="text-2xl font-bold mb-2 text-gray-900">Update Password</h2>
        <p class="text-gray-500 text-sm mb-6">Enter a strong new password for your account.</p>

        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">New Password</label>
            <input type="password" id="new-password" placeholder="••••••••" 
                   class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            
            <div class="mt-3">
                <div class="w-full bg-gray-200 rounded-full h-1.5">
                    <div id="strength-bar" class="bg-red-500 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <p id="strength-text" class="text-[10px] mt-1 text-gray-400 uppercase font-bold tracking-wider">Strength: None</p>
            </div>
        </div>

        <button id="update-btn" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition">
            Update Password
        </button>

        <p id="status-msg" class="mt-4 text-center text-sm hidden"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="reset-script.js"></script>
</body>
</html>
